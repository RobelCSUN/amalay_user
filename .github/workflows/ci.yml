name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  functions-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check Cloud Functions
        working-directory: functions
        run: node --check index.js

  firestore-rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install rules test deps
        working-directory: firebase/rules-tests
        run: npm install
      - name: Run rules tests in emulator
        working-directory: firebase/rules-tests
        run: |
          npx firebase-tools emulators:exec \
            --project amalay-a8a15 \
            --only firestore \
            "node --test"
